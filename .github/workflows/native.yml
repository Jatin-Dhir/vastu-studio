# Builds the native shells in the cloud: a debug APK on Linux and an unsigned
# iOS .ipa on a macOS runner (no Apple account needed — install via AltStore /
# Sideloadly, or sign later). Runs on tags and by hand.
name: Native builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: node scripts/gen-native-assets.mjs
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: VastuStudio-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: node scripts/gen-native-assets.mjs
      - name: Install pods
        run: cd ios/App && pod install
      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned .ipa
        run: |
          cd ios/App/build
          mkdir Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr VastuStudio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VastuStudio-ios-unsigned
          path: ios/App/build/VastuStudio-unsigned.ipa
