<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not on the plan — Vastu Studio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FFFFFF" />
  <!-- GitHub Pages serves this for any missing address under the site, at that address — so every
       link here is absolute; a relative one would point somewhere else at every depth. -->
  <link rel="icon" href="https://jatin-dhir.github.io/vastu-studio/favicon.svg" type="image/svg+xml" />
  <style>
    /* the studio's own static faces (they ship for its PDF reports), by absolute address; the
       look is the front page's: pale field, near-black ink, brass only on the mark */
    @font-face { font-family: 'Cormorant 404'; font-weight: 600; font-display: swap; src: url('https://jatin-dhir.github.io/vastu-studio/app/fonts/CormorantGaramond-600.ttf') format('truetype'); }
    @font-face { font-family: 'Inter 404'; font-weight: 400; font-display: swap; src: url('https://jatin-dhir.github.io/vastu-studio/app/fonts/Inter-400.ttf') format('truetype'); }
    @font-face { font-family: 'Inter 404'; font-weight: 600; font-display: swap; src: url('https://jatin-dhir.github.io/vastu-studio/app/fonts/Inter-600.ttf') format('truetype'); }
    :root { color-scheme: light; --ink: #1b1b1d; --ink-2: #48484c; --line-2: rgba(27, 27, 29, 0.22); --brass: #b38b3f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 0 20px;
      background: radial-gradient(70% 70% at 50% 46%, #fbfbf9 0%, #f4f4f1 62%, #ebeae6 100%) fixed #f4f4f1;
      color: var(--ink); font: 400 17px/1.6 'Inter 404', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    header { height: 72px; display: flex; align-items: center; justify-content: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 600 25px/1 'Cormorant 404', 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.01em; }
    .brand svg { color: var(--brass); flex: none; }
    main { align-self: center; justify-self: center; max-width: 36rem; padding: 48px 0 96px; text-align: center; }
    h1 { margin: 0 0 18px; font: 600 clamp(38px, 6.4vw, 64px)/1.04 'Inter 404', system-ui, sans-serif; letter-spacing: -0.03em; text-wrap: balance; }
    p { margin: 0 auto 32px; max-width: 28em; color: var(--ink-2); text-wrap: pretty; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    nav a { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid transparent; font-size: 15px; font-weight: 600; text-decoration: none; transition: background-color 0.3s ease, border-color 0.3s ease; }
    .primary { background: var(--ink); color: #fff; }
    .primary:hover { background: #000; }
    .line { border-color: var(--line-2); color: var(--ink); }
    .line:hover { border-color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="https://jatin-dhir.github.io/vastu-studio/" aria-label="Vastu Studio, front page">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="8.2" y="8.2" width="15.6" height="15.6" rx="1.5" transform="rotate(45 16 16)" fill="none" stroke="currentColor" stroke-width="2.2" /><circle cx="16" cy="16" r="3" fill="currentColor" /></svg>
      <span>Vastu Studio</span>
    </a>
  </header>
  <main>
    <h1>This page isn’t on the plan.</h1>
    <p>The address may be old or mistyped. Everything about Vastu Studio starts from the front page.</p>
    <nav aria-label="Ways back">
      <a class="primary" href="https://jatin-dhir.github.io/vastu-studio/">Go to the front page</a>
      <a class="line" href="https://jatin-dhir.github.io/vastu-studio/app/">Open the studio</a>
    </nav>
  </main>
</body>
</html>
